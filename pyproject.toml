[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-hisaab"
version = "0.2.0"
description = "Turn your bank statement into a plain-language monthly budget — free, offline, no bank login"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Shouvik Maji"}]

[project.scripts]
upi-hisaab = "upi_hisaab.cli:main"

[tool.setuptools.packages.find]
include = ["upi_hisaab*"]
